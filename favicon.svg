<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pełne kwadratowe tło bez zaokrąglonych rogów (brak parametru rx) -->
  <rect width="32" height="32" fill="#0f172a"/>
  
  <!-- Tło skali wskaźnika -->
  <path d="M 7 23 A 11 11 0 1 1 25 23" 
        fill="none" 
        stroke="#334155" 
        stroke-width="3" 
        stroke-linecap="round"/>
        
  <!-- Aktywny odczyt czujnika (turkus) -->
  <path d="M 7 23 A 11 11 0 0 1 23 9" 
        fill="none" 
        stroke="#06b6d4" 
        stroke-width="3" 
        stroke-linecap="round"/>
        
  <!-- Wskazówka pomiaru -->
  <line x1="16" y1="16" x2="21" y2="11" 
        stroke="#38bdf8" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
        
  <!-- Środek wskazówki -->
  <circle cx="16" cy="16" r="2.5" fill="#f8fafc"/>
  
  <!-- Dioda LED online -->
  <circle cx="25" cy="7" r="2" fill="#22c55e"/>
</svg>

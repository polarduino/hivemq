<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Czujników MQTT</title>

  <!-- Ikony Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2.1">
  <link rel="alternate icon" href="favicon.ico?v=2.1">

  <!-- Biblioteka MQTT.js do obsługi połączenia przez WebSockets -->
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>

  <!-- Skrypt aplikacji -->
  <script src="app.js?v=2.1" defer></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #38bdf8;
      --accent: #2563eb;
      --warning: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    /* Pasek nagłówka */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-bar h2 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Przyciski sterujące */
    .btn-badge {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-badge:hover {
      background: #334155;
      border-color: #475569;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
      box-shadow: 0 0 6px currentColor;
    }

    /* Dynamiczna siatka czujników (1 do 32) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .card.flash {
      border-color: var(--primary) !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35) !important;
    }

    /* Ostrzeżenie (żółty) */
    .card.status-warning {
      border-color: var(--warning);
      background: rgba(245, 158, 11, 0.08);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }
    .card.status-warning .val-box { color: #fbbf24; }

    /* Alarm (czerwony) */
    .card.status-alarm {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.35);
      animation: pulse-danger 2s infinite ease-in-out;
    }
    .card.status-alarm .val-box { color: #f87171; }

    @keyframes pulse-danger {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.25); }
      50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.55); }
    }

    .card h3 {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .val-wrapper {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 12px 0 4px 0;
    }

    .val-box {
      font-size: 2rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #ffffff;
      transition: opacity 0.3s ease, color 0.2s ease;
    }

    .unit {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Belka dolna */
    .meta-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .time-info span {
      color: var(--text-main);
      font-family: ui-monospace, monospace;
    }

    footer {
      font-size: 0.8rem;
      color: #64748b;
    }

    /* Modal / Ekran ładowania licencji */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      max-width: 480px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    .modal-card h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.25rem;
      color: #ffffff;
    }

    .modal-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .dropzone {
      border: 2px dashed #334155;
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      background: #0f172a;
      transition: border-color 0.2s, background-color 0.2s;
      margin-bottom: 16px;
    }

    /* Wyłączenie pointer-events dla wnętrza dropzone, aby nie gubiło zdarzenia dragleave/drop */
    .dropzone * {
      pointer-events: none;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.08);
    }

    .dropzone-text {
      font-size: 0.88rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .dropzone-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field-group input[type="password"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .field-group input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      margin-bottom: 20px;
    }

    .btn-unlock {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-unlock:hover {
      background: #1d4ed8;
    }

    .modal-error {
      color: var(--danger);
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 12px;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Ekran odblokowywania licencji (Modal) -->
  <div id="license-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Odblokuj Panel</h3>
      <p>Wskaż plik licencji obiektu (<code>.lic</code>) oraz wpisz hasło.</p>

      <input type="file" id="file-input" accept=".lic" style="display: none;">
      
      <div id="dropzone" class="dropzone" onclick="document.getElementById('file-input').click()">
        <div id="dropzone-label" class="dropzone-text">📂 Kliknij lub przeciągnij plik .lic</div>
        <div class="dropzone-sub">Plik konfiguracyjny obiektu</div>
      </div>

      <div class="field-group">
        <label for="password-input">Hasło:</label>
        <input type="password" id="password-input" placeholder="Wpisz hasło klienta...">
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="remember-checkbox" checked>
        Zapamiętaj licencję w tej przeglądarce
      </label>

      <button type="button" id="btn-unlock" class="btn-unlock">🔓 Odszyfruj i uruchom</button>
      <div id="modal-error-msg" class="modal-error"></div>
    </div>
  </div>

  <!-- Główny kontener dashboardu -->
  <div class="container">
    <div class="header-bar">
      <h2 id="dashboard-title">Panel Odczytów</h2>
      <div class="header-controls">
        <button id="voice-toggle-btn" class="btn-badge" title="Włącz lub wyłącz mowę">
          <span id="voice-icon">🔇</span> <span id="voice-text">Dźwięk: Wyłączony</span>
        </button>
        <button id="license-switch-btn" class="btn-badge" title="Zmień plik licencji">
          <span>🔑</span> <span>Licencja</span>
        </button>
        <div class="status-badge">
          <span id="status-dot" class="dot"></span>
          <span id="status">Brak licencji</span>
        </div>
      </div>
    </div>

    <!-- Dynamiczna siatka czujników (generowana w locie przez app.js) -->
    <div class="grid" id="sensors-grid"></div>

    <div class="meta-box">
      <div class="time-info">Ostatnia odebrana paczka: <span id="last-time">brak</span></div>
      <footer>Wersja: <span id="app-version">--</span></footer>
    </div>
  </div>

</body>
</html>

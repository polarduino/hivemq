<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Czujników MQTT</title>

  <!-- Biblioteka MQTT.js do obsługi połączenia przez WebSockets -->
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>

  <!-- Pliki konfiguracyjne i skrypt aplikacji z parametrem unikania cache (?v=1.9) -->
  <script src="config.js?v=1.9"></script>
  <script src="app.js?v=1.9" defer></script>

  <style>
    /* Zmienne motywu graficznego (ciemny interfejs) */
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #38bdf8;
      --accent: #2563eb;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Pasek nagłówka z tytułem i statusem połączenia */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-bar h2 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Przycisk aktywacji / wyciszania głosu */
    .audio-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .audio-btn:hover {
      background: #334155;
      border-color: #475569;
    }

    /* Pigułka ze statusem połączenia */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    /* Dioda LED sygnalizująca stan brokera/danych */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
      box-shadow: 0 0 6px currentColor;
    }

    /* Siatka kafelków */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    /* Pojedyncza karta odczytu */
    .card {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    /* Efekt mignięcia po przybyciu nowej wartości */
    .card.flash {
      border-color: var(--primary) !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35) !important;
    }

    /* STYL OSTRZEŻENIA (żółty) */
    .card.status-warning {
      border-color: var(--warning);
      background: rgba(245, 158, 11, 0.08);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }
    .card.status-warning .val-box {
      color: #fbbf24;
    }

    /* STYL ALARMU (czerwony) */
    .card.status-alarm {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.35);
      animation: pulse-danger 2s infinite ease-in-out;
    }
    .card.status-alarm .val-box {
      color: #f87171;
    }

    @keyframes pulse-danger {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.25); }
      50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.55); }
    }

    .card h3 {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .val-wrapper {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 12px 0 4px 0;
    }

    .val-box {
      font-size: 2rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #ffffff;
      transition: opacity 0.3s ease, color 0.2s ease;
    }

    .unit {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Belka dolna z czasem i wersją */
    .meta-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .time-info span {
      color: var(--text-main);
      font-family: ui-monospace, monospace;
    }

    footer {
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Pasek tytułowy (tytuł podmieniany przez app.js z config.js) -->
    <div class="header-bar">
      <h2 id="dashboard-title">Panel Odczytów</h2>
      <div class="header-controls">
        <button id="voice-toggle-btn" class="audio-btn" title="Kliknij, aby włączyć lub wyciszyć komunikaty głosowe">
          <span id="voice-icon">🔇</span> <span id="voice-text">Dźwięk: Wyłączony</span>
        </button>
        <div class="status-badge">
          <span id="status-dot" class="dot"></span>
          <span id="status">Łączenie...</span>
        </div>
      </div>
    </div>

    <!-- 10 kafelków czujników -->
    <div class="grid">
      <div class="card" id="card-s1"><h3 id="name-s1">Czujnik 1</h3><div class="val-wrapper"><span class="val-box" id="s1">--</span><span class="unit" id="unit-s1"></span></div></div>
      <div class="card" id="card-s2"><h3 id="name-s2">Czujnik 2</h3><div class="val-wrapper"><span class="val-box" id="s2">--</span><span class="unit" id="unit-s2"></span></div></div>
      <div class="card" id="card-s3"><h3 id="name-s3">Czujnik 3</h3><div class="val-wrapper"><span class="val-box" id="s3">--</span><span class="unit" id="unit-s3"></span></div></div>
      <div class="card" id="card-s4"><h3 id="name-s4">Czujnik 4</h3><div class="val-wrapper"><span class="val-box" id="s4">--</span><span class="unit" id="unit-s4"></span></div></div>
      <div class="card" id="card-s5"><h3 id="name-s5">Czujnik 5</h3><div class="val-wrapper"><span class="val-box" id="s5">--</span><span class="unit" id="unit-s5"></span></div></div>
      <div class="card" id="card-s6"><h3 id="name-s6">Czujnik 6</h3><div class="val-wrapper"><span class="val-box" id="s6">--</span><span class="unit" id="unit-s6"></span></div></div>
      <div class="card" id="card-s7"><h3 id="name-s7">Czujnik 7</h3><div class="val-wrapper"><span class="val-box" id="s7">--</span><span class="unit" id="unit-s7"></span></div></div>
      <div class="card" id="card-s8"><h3 id="name-s8">Czujnik 8</h3><div class="val-wrapper"><span class="val-box" id="s8">--</span><span class="unit" id="unit-s8"></span></div></div>
      <div class="card" id="card-s9"><h3 id="name-s9">Czujnik 9</h3><div class="val-wrapper"><span class="val-box" id="s9">--</span><span class="unit" id="unit-s9"></span></div></div>
      <div class="card" id="card-s10"><h3 id="name-s10">Czujnik 10</h3><div class="val-wrapper"><span class="val-box" id="s10">--</span><span class="unit" id="unit-s10"></span></div></div>
    </div>

    <!-- Pasek informacyjny: znacznik czasu ostatniej paczki i wersja -->
    <div class="meta-box">
      <div class="time-info">Ostatnia odebrana paczka: <span id="last-time">brak</span></div>
      <footer>Wersja: <span id="app-version">--</span></footer>
    </div>
  </div>

</body>
</html>
